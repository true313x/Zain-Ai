name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate (and unzip, if needed) the project
        run: |
          if ls *.zip >/dev/null 2>&1; then
            Z=$(ls -t *.zip | head -1)
            echo "Unzipping $Z"
            mkdir -p _src && unzip -q -o "$Z" -d _src
            S=$(find _src -name settings.gradle.kts | head -1)
          else
            S=$(find . -name settings.gradle.kts -not -path './_src/*' | head -1)
          fi
          test -n "$S" || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --continue --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors in summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/_src/ZainIQ/##' | head -80
            grep -A3 'What went wrong' build.log | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ZainIQ-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases (direct download, no unzip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZainIQ debug build ${{ github.run_number }}
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
